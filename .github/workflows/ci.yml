name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core-banking-service
          - internet-banking-api-gateway
          - internet-banking-config-server
          - internet-banking-service-registry
          - internet-banking-user-service
          - internet-banking-fund-transfer-service
          - internet-banking-utility-payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/jacoco/test
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET

          path = "${{ matrix.module }}/build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.exists(path):
              raise SystemExit(0)

          root = ET.parse(path).getroot()
          missed = covered = 0
          for counter in root.findall("counter"):
              if counter.get("type") == "LINE":
                  missed = int(counter.get("missed"))
                  covered = int(counter.get("covered"))
          total = missed + covered
          pct = (covered / total * 100) if total else 0.0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"**${{ matrix.module }}** line coverage: {pct:.1f}% ({covered}/{total})\n")
          EOF

  integration-test:
    name: Integration test (${{ matrix.module }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core-banking-service
          - internet-banking-api-gateway
          - internet-banking-utility-payment-service
          - internet-banking-fund-transfer-service
          - internet-banking-user-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests
        working-directory: ${{ matrix.module }}
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/integrationTest
          if-no-files-found: ignore
