name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core-banking-service
          - internet-banking-api-gateway
          - internet-banking-config-server
          - internet-banking-service-registry
          - internet-banking-user-service
          - internet-banking-fund-transfer-service
          - internet-banking-utility-payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/test
          if-no-files-found: ignore

  devin-review:
    name: Devin Review
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Devin Review
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DEVIN_API_KEY" ] || [ -z "$DEVIN_ORG_ID" ]; then
            echo "::warning::DEVIN_API_KEY / DEVIN_ORG_ID secrets not set; skipping Devin Review"
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/pr-reviews" \
            -H "Authorization: Bearer ${DEVIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"pr_url\": \"${PR_URL}\"}")
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Devin Review request failed with HTTP $status"
            exit 1
          fi
